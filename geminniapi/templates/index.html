<!DOCTYPE html>
<html>
<head>
<title>Gemini AI Transaction Explainer</title>

<style>
body{
font-family:Arial;
text-align:center;
margin-top:100px;
background:#f5f5f5;
}

input{
padding:10px;
width:300px;
font-size:16px;
}

button{
padding:10px 20px;
font-size:16px;
cursor:pointer;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
}

#result{
margin-top:30px;
font-size:18px;
color:#333;
}
</style>

</head>

<body>

<h2>Gemini AI Transaction Explainer</h2>

<input type="text" id="transaction" placeholder="Example: Paid ₹500 to Amazon">
<br><br>

<button onclick="sendTransaction()">Explain</button>

<div id="result"></div>

<script>

function sendTransaction(){

const transaction = document.getElementById("transaction").value;

fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
transaction:transaction
})
})

.then(response => response.json())

.then(data => {

if(data.error){
document.getElementById("result").innerText=data.error;
}
else{
document.getElementById("result").innerText=data.explanation;
}

})

.catch(error=>{
document.getElementById("result").innerText="Server error";
console.log(error);
});

}

</script>

</body>
</html>
